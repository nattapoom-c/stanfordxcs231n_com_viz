[project]
name = "xcs231n"
version = "0.1.0"
description = "Deep learning for computer vision course environment"
requires-python = ">=3.12"
dependencies = [
    "pip==25.1",
    "notebook==7.5.3",
    "h5py==3.14.0",
    "imageio==2.37.3",
    "ipython==9.15.0",
    "json5==0.12.1",
    "matplotlib==3.10.8",
    "pillow==12.0.0",
    "future==1.0.0",
    "cython==3.2.5",
    "scipy==1.18.0",
    "pandas==3.0.3",
    "tqdm==4.68.2",
    "scikit-learn==1.9.0",
    "ftfy==6.3.1",
    "regex==2026.7.19",
    "thop==0.1.1-2209072238",
    "numpy==2.5.1",
    "tensorflow==2.21.0",
    "tensorflow_datasets==4.9.10",
    "opencv-python==5.0.0.93",
    "clip",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ipykernel>=7.3.0",
]
